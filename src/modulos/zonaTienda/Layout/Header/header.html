<div class="container">
  <div class="row">
    <div class="col-2">
      <a routerLink="/" aria-label="Volver al inicio">
        <img src="/imagenes/logo_pccomponentes.png" alt="logo" class="img-fluid" style="cursor: pointer" />
      </a>
    </div>

    <div class="col-2"><app-off-canvas-cats /></div>

    <div class="col-4">
      <div class="d-flex flex-row justify-content-between mt-5 mb-4">
        <div class="dropdown">
          <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="dropdownCatalogo" data-bs-toggle="dropdown" aria-expanded="false" style="border-radius: 0">
            Todo el Catálogo
          </button>
          <ul class="dropdown-menu" aria-labelledby="dropdownCatalogo">
            <li><a class="dropdown-item" routerLink="/">Todo el Catálogo</a></li>
            <li><a class="dropdown-item" href="#reacondicionados">Reacondicionados</a></li>
          </ul>
        </div>

        <div class="input-group w-100">
          <input type="search" class="form-control" style="border-radius: 0" placeholder="Buscar" aria-label="Buscar" />
          <button class="btn btn-outline-secondary" style="border-radius: 0" type="button" aria-label="Buscar">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="col-4">
      <div class="d-flex flex-row justify-content-end mt-5 mb-4 header-actions">
        <button class="btn btn-outline-secondary btn-sm ai-button" type="button">
          <img src="/imagenes/icono_stars.png" alt="icono stars" /> Buscar con IA
        </button>
        <app-session-button />
        <button class="btn btn-light btn-sm basket-button" type="button" (click)="cartDrawer.open()">
          <span class="position-relative me-1">
            <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
            @if (store.cantidadArticulos() > 0) {
              <span class="badge rounded-pill text-bg-danger position-absolute top-0 start-100 translate-middle">{{ store.cantidadArticulos() }}</span>
            }
          </span>
          Mi Cesta
        </button>
      </div>
    </div>
  </div>
</div>

<app-off-canvas-carrito #cartDrawer />
