@if (cargando()) {
  <p class="muted">Cargando categorías…</p>
} @else if (error()) {
  <p class="error-message">{{ error() }}</p>
} @else if (categorias().length === 0) {
  <p class="muted">No hay categorías disponibles.</p>
} @else {
  <ul class="list-group list-group-flush category-list">
    @for (categoria of categorias(); track categoria._id) {
      <li class="list-group-item" [class.active]="categoriaActiva?._id === categoria._id">
        <button class="category-row" type="button" (click)="categoriaElegida.emit(categoria)">
          <span class="category-name">@if (categoria.icon) { <img [src]="categoria.icon" [alt]="categoria.nombre" /> } {{ categoria.nombre }}</span>
          <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
        </button>
      </li>
    }
  </ul>
}
