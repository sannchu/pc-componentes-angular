@if (categoriaPadre) {
  <aside class="subcategories-panel" aria-label="Subcategorías">
    <header class="subcategories-header">
      <h3>{{ categoriaPadre.nombre }}</h3>
      <button class="btn-close" type="button" (click)="cerrarPanel.emit()" aria-label="Cerrar subcategorías"></button>
    </header>
    <button class="button button-primary all-category" type="button" (click)="mostrarProductos(categoriaPadre.pathCat)">
      Ver toda la categoría
    </button>
    @if (cargando()) {
      <p class="muted">Cargando subcategorías…</p>
    } @else if (error()) {
      <p class="error-message">{{ error() }}</p>
    } @else if (categorias().length === 0) {
      <p class="muted">No hay subcategorías.</p>
    } @else {
      <ul class="subcategories-list">
        @for (categoria of categorias(); track categoria._id) {
          <app-dropdown-subcategorias
            [subcategoria]="categoria"
            [abierta]="categoriaAbierta() === categoria._id"
            (alternar)="alternarCategoria(categoria)"
            (seleccionar)="mostrarProductos($event)"
          />
        }
      </ul>
    }
  </aside>
}
