<button class="btn btn-outline-secondary mt-5 mb-4" type="button" (click)="alternar()" [attr.aria-expanded]="abierto()">
  <i class="fa-solid fa-bars" aria-hidden="true"></i> Todas las categorias
</button>

@if (abierto()) {
  <div class="drawer-backdrop" (click)="cerrar()" (keydown.escape)="cerrar()"></div>
  <section class="offcanvas offcanvas-start show category-drawer" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="category-drawer-title">
    <header class="offcanvas-header drawer-header">
      <h2 class="offcanvas-title" id="category-drawer-title">Campañas y ofertas</h2>
      <button class="btn-close" type="button" (click)="cerrar()" aria-label="Cerrar categorías"></button>
    </header>
    <div class="offcanvas-body drawer-content">
      <h3><strong>Categorias</strong></h3>
      <app-lista-categorias
        pathCat="principales"
        [categoriaActiva]="categoriaSeleccionada()"
        (categoriaElegida)="seleccionarCategoria($event)"
      />
    </div>
    <app-panel-subcategorias
      [categoriaPadre]="categoriaSeleccionada()"
      (cerrarPanel)="categoriaSeleccionada.set(null)"
      (categoriaElegida)="cerrar()"
    />
  </section>
}
