<main class="comunicacion">
  <h1>Comunicación entre componentes</h1>
  <p class="introduccion">
    El componente padre configura la caja y recibe el texto que escribe el hijo.
  </p>

  <section class="ejemplo">
    <h2>Formulario padre</h2>

    <app-caja-texto
      [tipo]="caja.tipo"
      [placeholder]="caja.placeholder"
      (contenidoEvent)="capturarTextoDelInputHijo($event)"
    />

    <p class="resultado">
      Texto recibido por el padre:
      <strong>{{ textoRecibido() || 'Todavía no has escrito nada.' }}</strong>
    </p>
  </section>
</main>
